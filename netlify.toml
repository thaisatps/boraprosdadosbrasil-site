# Deploy no Netlify (alternativa ao S3 + CloudFront de infra/terraform).
# Build: gera dist/ substituindo __SITE_URL__ / __GA_ID__ / __CONSENT__ (e as datas das páginas, do git).
# Configure no painel (Site configuration → Environment variables):
#   SITE_URL (opcional — sem ela usa a URL principal do Netlify), GA_MEASUREMENT_ID, CONSENT_MODE
#   opcionais de SEO: GOOGLE_SITE_VERIFICATION, BING_SITE_VERIFICATION (meta de verificação na home),
#   INDEXNOW_KEY (publica /<chave>.txt para o IndexNow), PRERENDER=0 (desliga a pré-renderização dos catálogos)
[build]
  command = "python3 scripts/build.py"
  publish = "dist"

# Cabeçalhos de segurança equivalentes à response headers policy do CloudFront
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache longo para fontes e imagens; HTML e dados sempre revalidados
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
# biblioteca de gráficos extraída no build, com a versão no nome do arquivo
[[headers]]
  for = "/assets/js/echarts-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Página de demonstração dos componentes de interface (uso interno): fora do índice
[[headers]]
  for = "/_componentes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Arquivos para buscadores de IA: texto puro em UTF-8, fora do índice do Google
# (para não competir com as páginas HTML), mas livres para leitura e citação.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=3600"

# Páginas oficiais arquivadas em /dados/legislacao-fiscal/ (Planalto, STF): são HTML de terceiros,
# com scripts próprios: servidas como download, para não rodarem como página deste site.
[[headers]]
  for = "/dados/legislacao-fiscal/*"
  [headers.values]
    Content-Disposition = "attachment"
    X-Robots-Tag = "noindex"

# Links de seleção compartilhada (/c/1-3-5): fora do índice dos buscadores, mas sem bloquear
# no robots.txt (os robôs de prévia do WhatsApp/Facebook precisam ler o OG).
[[headers]]
  for = "/c/*"
  [headers.values]
    X-Robots-Tag = "noindex"
# registro único das comparações e livro-razão dos IDs: revalidam a cada 5 min
[[headers]]
  for = "/dados/comparacoes.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
[[headers]]
  for = "/dados/comparacoes-ids.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Catálogo: o nome antigo /meus-dados/ vira /comparacoes/ (301 permanente).
[[redirects]]
  from = "/meus-dados"
  to = "/comparacoes/"
  status = 301
  force = true
[[redirects]]
  from = "/meus-dados/*"
  to = "/comparacoes/"
  status = 301
  force = true

# Seleção compartilhada (canônico, decisão do dono 8): /c/1-3-5-6-7 → página de chegada
# (rewrite 200, a URL fica igual). Sem "force": arquivos que existem têm prioridade
# (shadowing), então /c/<slug>/ estáticos (temas) continuam valendo. O build recusa slug
# que pareça seleção (^[pb]?\d+(-[pb]?\d+)*$) e os nomes reservados.
[[redirects]]
  from = "/c/*"
  to = "/c/index.html"
  status = 200
